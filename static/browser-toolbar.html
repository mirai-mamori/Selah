<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://ipc.localhost; script-src 'self' 'unsafe-inline' https://ipc.localhost; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:">
<style>
  :root {
    color-scheme: light dark;
    --accent: #173b68;
    --red: #d92d20;
    --bg: rgba(245, 245, 247, 0.82);
    --surface: rgba(255, 255, 255, 0.66);
    --surface-strong: rgba(255, 255, 255, 0.9);
    --border: rgba(0, 0, 0, 0.09);
    --text: #1d1d1f;
    --text-2: #5d5d63;
    --text-3: #86868b;
    --shadow: 0 5px 22px rgba(0, 0, 0, 0.1);
    --blur: blur(22px) saturate(1.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    -webkit-app-region: drag;
    user-select: none; -webkit-user-select: none;
    background: transparent;
    color: var(--text);
  }
  body {
    display: flex; align-items: center;
    padding: 5px 10px 5px 78px;
    gap: 8px;
    background:
      linear-gradient(180deg, var(--surface-strong), var(--bg));
    border-bottom: 0.5px solid var(--border);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
  }
  .btn {
    -webkit-app-region: no-drag;
    border: none; background: transparent; cursor: pointer;
    width: 36px; height: 36px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3);
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease;
    flex-shrink: 0;
  }
  .btn:hover { background: rgba(0,0,0,0.06); color: var(--text); }
  .btn:active { transform: scale(0.94); background: rgba(0,0,0,0.1); }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }
  .nav-btn svg { width: 23px; height: 23px; }
  .btn.disabled { opacity: 0.25; pointer-events: none; }
  .nav-group,
  .right-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .url-bar {
    -webkit-app-region: no-drag;
    flex: 1;
    min-width: 60px;
    height: 36px;
    border-radius: 999px;
    background: var(--surface);
    padding: 0 15px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 9px;
    overflow: hidden;
    font-size: 12.5px;
    color: var(--text-2);
    cursor: default;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
    border: 0.5px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.34), 0 1px 6px rgba(0,0,0,0.04);
  }
  .url-bar:hover {
    background: color-mix(in srgb, var(--accent) 7%, var(--surface));
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.38), 0 2px 10px rgba(0,0,0,0.06);
  }
  .url-bar.copied {
    background: rgba(59,130,246,0.08);
    color: rgba(59,130,246,0.7);
    border-color: rgba(59,130,246,0.15);
  }
  .url-lock {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.44;
  }
  .url-text {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .sep { width: 1px; height: 18px; background: var(--border); margin: 0 1px; flex-shrink: 0; }
  .agent-status {
    -webkit-app-region: no-drag;
    display: none;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 9px 0 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--accent);
    border: 0.5px solid color-mix(in srgb, var(--accent) 24%, var(--border));
    font-size: 12px;
    font-weight: 650;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .agent-status.active { display: flex; }
  .agent-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .agent-stop {
    border: none;
    border-radius: 999px;
    padding: 4px 9px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: inherit;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
  }
  .agent-stop:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .action-btn {
    width: 104px;
    padding: 0 12px;
    border-radius: 999px;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 700;
    justify-content: center;
  }
  .action-btn svg {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
  }
  .agent-logo {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex: 0 0 auto;
  }
  .action-label {
    min-width: 0;
    overflow: hidden;
    line-height: 1.08;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .agent-btn {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 9%, var(--surface));
    border: 0.5px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    box-shadow: 0 2px 10px rgba(0, 122, 255, 0.1);
  }
  .agent-btn:hover {
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    color: var(--accent);
    box-shadow: 0 4px 14px rgba(0, 122, 255, 0.14);
  }

  /* Dark mode — triggered by system OR manual [data-theme="dark"] */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]), html:not([data-theme="light"]) body {
      --accent: #fbbf24;
      --bg: rgba(28, 28, 30, 0.84);
      --surface: rgba(44, 44, 46, 0.68);
      --surface-strong: rgba(34, 34, 36, 0.92);
      --border: rgba(255,255,255,0.11);
      --text: #f5f5f7;
      --text-2: #c7c7cc;
      --text-3: #98989d;
      background: linear-gradient(180deg, var(--surface-strong), var(--bg));
      border-bottom-color: var(--border);
    }
    html:not([data-theme="light"]) .btn { color: var(--text-3); }
    html:not([data-theme="light"]) .btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    html:not([data-theme="light"]) .btn:active { background: rgba(255,255,255,0.12); }
    html:not([data-theme="light"]) .url-bar {
      background: var(--surface);
      color: var(--text-2);
      border-color: var(--border);
    }
    html:not([data-theme="light"]) .url-bar:hover {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
    }
    html:not([data-theme="light"]) .url-bar.copied {
      background: rgba(96,165,250,0.1);
      color: rgba(96,165,250,0.7);
      border-color: rgba(96,165,250,0.15);
    }
    html:not([data-theme="light"]) .agent-status {
      background: color-mix(in srgb, var(--accent) 13%, var(--surface));
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }
    html:not([data-theme="light"]) .agent-stop { background: color-mix(in srgb, var(--accent) 13%, transparent); }
    html:not([data-theme="light"]) .agent-stop:hover { background: color-mix(in srgb, var(--accent) 21%, transparent); }
    html:not([data-theme="light"]) .agent-btn {
      background: color-mix(in srgb, var(--accent) 14%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
    }
    html:not([data-theme="light"]) .sep { background: var(--border); }
  }

  /* Manual dark override */
  html[data-theme="dark"], html[data-theme="dark"] body {
    --accent: #fbbf24;
    --bg: rgba(28, 28, 30, 0.84);
    --surface: rgba(44, 44, 46, 0.68);
    --surface-strong: rgba(34, 34, 36, 0.92);
    --border: rgba(255,255,255,0.11);
    --text: #f5f5f7;
    --text-2: #c7c7cc;
    --text-3: #98989d;
    background: linear-gradient(180deg, var(--surface-strong), var(--bg));
    border-bottom-color: var(--border);
  }
  html[data-theme="dark"] .btn { color: var(--text-3); }
  html[data-theme="dark"] .btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  html[data-theme="dark"] .btn:active { background: rgba(255,255,255,0.12); }
  html[data-theme="dark"] .url-bar {
    background: var(--surface);
    color: var(--text-2);
    border-color: var(--border);
  }
  html[data-theme="dark"] .url-bar:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
  }
  html[data-theme="dark"] .url-bar.copied {
    background: rgba(96,165,250,0.1);
    color: rgba(96,165,250,0.7);
    border-color: rgba(96,165,250,0.15);
  }
  html[data-theme="dark"] .agent-status {
    background: color-mix(in srgb, var(--accent) 13%, var(--surface));
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
  }
  html[data-theme="dark"] .agent-stop { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  html[data-theme="dark"] .agent-stop:hover { background: color-mix(in srgb, var(--accent) 21%, transparent); }
  html[data-theme="dark"] .agent-btn {
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
  }
  html[data-theme="dark"] .sep { background: var(--border); }

  @media (max-width: 520px) {
    body { padding-left: 74px; gap: 5px; }
    .btn { width: 32px; height: 32px; }
    .btn svg { width: 18px; height: 18px; }
    .nav-btn svg { width: 21px; height: 21px; }
    .url-bar { height: 32px; padding: 0 12px; font-size: 12px; }
    .action-btn { width: 80px; height: 32px; padding: 0 9px; font-size: 11px; gap: 5px; }
    .action-btn svg { width: 17px; height: 17px; }
    .agent-logo { width: 19px; height: 19px; }
    .nav-group { gap: 2px; }
    .agent-status { max-width: 132px; }
    #agentStatusText {
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }
  @media (max-width: 420px) {
    .agent-status { display: none !important; }
    .action-btn {
      width: 36px;
      padding: 0;
    }
    .action-label { display: none; }
    #external { display: inline-flex; }
  }
</style>
</head>
<body>
  <div class="nav-group">
    <button class="btn nav-btn" id="back" title="戻る">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="btn nav-btn" id="forward" title="進む">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
    <button class="btn" id="reload" title="再読み込み">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>
  <div class="url-bar" id="url"><span class="url-lock"></span><span class="url-text" id="urlText"></span></div>
  <div class="agent-status" id="agentStatus" aria-live="polite">
    <span class="agent-dot"></span>
    <span id="agentStatusText">エージェント操作中</span>
    <button class="agent-stop" id="agentStop" type="button" title="エージェントを停止">停止</button>
  </div>
  <div class="right-group">
    <button class="btn action-btn agent-btn" id="agent" title="エージェント">
      <img class="agent-logo" src="logo.png" alt="">
      <span class="action-label">エージェント</span>
    </button>
    <button class="btn action-btn" id="external" title="外部ブラウザで開く">
      <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
      <span class="action-label">システムブラウザ</span>
    </button>
  </div>

<script>
(async () => {
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;

  // --- Theme sync ---
  function applyTheme(theme) {
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  // Read initial theme from main app's localStorage via Rust command
  try {
    const saved = await invoke('get_app_theme');
    if (saved) applyTheme(saved);
  } catch(e) {}

  // Listen for live theme changes from main webview
  await listen('theme-changed', (event) => {
    applyTheme(event.payload);
  });

  // --- URL bar ---
  const params = new URLSearchParams(window.location.search);
  const target = params.get('target');
  const urlBar = document.getElementById('url');
  const urlText = document.getElementById('urlText');
  let currentUrl = '';

  function displayUrl(url) {
    currentUrl = url;
    try {
      const u = new URL(url);
      let display = u.hostname.replace('www.', '');
      let path = u.pathname;
      if (path.length > 1) display += path.replace(/\/$/, '');
      urlText.textContent = display;
      urlBar.title = url;
    } catch(e) {
      urlText.textContent = url || '読み込み中…';
      urlBar.title = url;
    }
  }
  displayUrl('');

  // Listen for URL change events from Rust
  await listen('browser-url-changed', (event) => {
    displayUrl(event.payload);
  });

  const agentStatus = document.getElementById('agentStatus');
  const agentStatusText = document.getElementById('agentStatusText');
  await listen('browser-agent-status', (event) => {
    const payload = event.payload || {};
    if (payload.active) {
      const action = payload.action ? `エージェント操作中: ${payload.action}` : 'エージェント操作中';
      agentStatusText.textContent = action;
      agentStatus.classList.add('active');
    } else {
      agentStatus.classList.remove('active');
      agentStatusText.textContent = 'エージェント操作中';
    }
  });

  // Get initial URL
  try {
    const url = await invoke('browser_get_url', { target });
    if (url && url !== 'about:blank') displayUrl(url);
  } catch(e) {}

  document.getElementById('back').onclick = () =>
    invoke('browser_go_back', { target }).catch(() => {});
  document.getElementById('forward').onclick = () =>
    invoke('browser_go_forward', { target }).catch(() => {});
  document.getElementById('reload').onclick = () =>
    invoke('browser_reload', { target }).catch(() => {});

  async function openAgentFromToolbar() {
    let pageTitle = '';
    try {
      pageTitle = await invoke('browser_get_page_title', { target });
    } catch(e) {}
    if (!pageTitle) {
      try {
        const url = await invoke('browser_get_url', { target });
        if (url && url !== 'about:blank') pageTitle = new URL(url).host || url;
      } catch(e) {}
    }
    invoke('open_agent_popup', {
      ownerLabel: target ? target.replace(/-(ct|tb)$/, '') : null,
      target,
      title: pageTitle,
      kind: 'browser'
    }).catch(() => {});
  }

  document.getElementById('agent').onclick = () => openAgentFromToolbar();

  document.getElementById('agentStop').onclick = (e) => {
    e.stopPropagation();
    invoke('agent_cancel_active').catch(() => {});
    openAgentFromToolbar();
  };

  document.getElementById('external').onclick = async () => {
    try {
      const url = await invoke('browser_get_url', { target });
      if (url && url !== 'about:blank') await invoke('open_in_system_browser', { url });
    } catch(e) {}
  };

  // Window dragging — maximize draggable area (buttons excluded, url-bar included)
  const { getCurrentWindow } = window.__TAURI__.window;
  const appWindow = getCurrentWindow();
  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.btn')) return;
    if (e.button === 0) appWindow.startDragging();
  });

  // URL bar: copy on click
  urlBar.addEventListener('click', () => {
    if (!currentUrl) return;
    navigator.clipboard.writeText(currentUrl).then(() => {
      const orig = urlText.textContent;
      urlText.textContent = '✓ コピーしました';
      urlBar.classList.add('copied');
      setTimeout(() => {
        urlText.textContent = orig;
        urlBar.classList.remove('copied');
      }, 1200);
    }).catch(() => {});
  });
})();
</script>
</body>
</html>
