<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://ipc.localhost; script-src 'self' 'unsafe-inline' https://ipc.localhost; style-src 'self' 'unsafe-inline'; connect-src ipc: http://ipc.localhost https://ipc.localhost; img-src 'self' data:">
<title>エージェント</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #173b68;
    --accent-2: #244f86;
    --green: #248a3d;
    --red: #d92d20;
    --bg: #f5f5f7;
    --surface: rgba(255, 255, 255, 0.72);
    --surface-strong: rgba(255, 255, 255, 0.9);
    --surface-soft: rgba(255, 255, 255, 0.52);
    --border: rgba(0, 0, 0, 0.09);
    --border-strong: rgba(0, 0, 0, 0.14);
    --text: #1d1d1f;
    --text-2: #5d5d63;
    --text-3: #86868b;
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.12);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.07);
    --blur: blur(22px) saturate(1.55);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.74), rgba(245,245,247,0.95)),
      var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    flex-direction: column;
    min-width: 300px;
  }
  button, textarea { font: inherit; }
  button { -webkit-app-region: no-drag; }

  .panel {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-left: 0.5px solid var(--border);
    background: rgba(245, 245, 247, 0.78);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 12px 10px;
    background: linear-gradient(180deg, var(--surface-strong), rgba(255,255,255,0.62));
    border-bottom: 0.5px solid var(--border);
    -webkit-app-region: drag;
  }
  body:not(.embedded) .topbar { padding-left: 78px; }
  .brand {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    flex: 0 0 auto;
    margin-top: 1px;
    object-fit: contain;
    background: transparent;
    box-shadow: none;
  }
  .head-text {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .title-row {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    min-width: 0;
  }
  .title {
    min-width: 0;
    flex: 1;
    font-size: 14px;
    font-weight: 700;
    overflow: hidden;
    line-height: 1.28;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .meta-row {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kind-tag {
    min-width: 0;
    max-width: 100%;
    height: 20px;
    display: inline-flex;
    align-items: center;
    padding: 0 8px;
    border-radius: 999px;
    color: var(--text-2);
    background: rgba(0, 0, 0, 0.045);
    border: 0.5px solid var(--border);
    font-size: 10.5px;
    font-weight: 650;
  }
  body.page-kind-reader .kind-tag {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 9%, var(--surface-soft));
    border-color: color-mix(in srgb, var(--accent) 24%, var(--border));
  }
  .live-pill {
    display: none;
    align-items: center;
    gap: 5px;
    height: 19px;
    padding: 0 7px;
    border-radius: 999px;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    border: 0.5px solid color-mix(in srgb, var(--accent) 24%, var(--border));
    font-size: 10.5px;
    font-weight: 650;
    white-space: nowrap;
  }
  .live-pill.active { display: inline-flex; }
  .live-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .icon-btn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 10px;
    display: inline-grid;
    place-items: center;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .icon-btn:hover {
    background: rgba(0, 0, 0, 0.06);
    color: var(--text);
  }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .close { display: none; }
  body.embedded .close { display: inline-grid; }

  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.14);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  .empty {
    margin: auto;
    width: min(280px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
    line-height: 1.55;
    padding: 20px 8px;
  }
  .empty-mark {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    object-fit: contain;
    background: transparent;
    box-shadow: none;
    opacity: 0.94;
  }
  .empty-title {
    margin: 0;
    color: var(--text-2);
    font-size: 13.5px;
    font-weight: 650;
  }
  .empty-body { margin: 0; }

  .row {
    display: flex;
    max-width: 100%;
    gap: 8px;
    animation: msg-enter 0.22s ease-out;
  }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; align-items: flex-start; }
  @keyframes msg-enter {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    flex: 0 0 auto;
    margin-top: 2px;
    object-fit: contain;
    background: transparent;
    box-shadow: none;
  }
  .avatar.pulse {
    animation: avatar-pulse 2s ease-in-out infinite;
  }
  @keyframes avatar-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .68; transform: scale(.96); }
  }
  .bubble {
    max-width: calc(100% - 34px);
    min-width: 0;
    padding: 10px 12px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.58;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    user-select: text;
    -webkit-user-select: text;
  }
  .row.user .bubble {
    max-width: 82%;
    color: #fff;
    background: var(--accent);
    border-bottom-right-radius: 6px;
    box-shadow: 0 2px 9px rgba(0, 88, 180, 0.18);
  }
  .row.assistant .bubble {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-top-left-radius: 6px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
  }
  .bubble.error {
    color: #8f1d14;
    border-color: rgba(217, 45, 32, 0.22);
    background: rgba(255, 242, 240, 0.86);
  }
  .bubble:empty::after {
    content: "";
    display: inline-block;
    width: 28px;
    height: 8px;
    border-radius: 999px;
    background:
      radial-gradient(circle, var(--accent) 40%, transparent 42%) 0 50% / 9px 8px repeat-x;
    opacity: 0.75;
    animation: dots 1.1s ease-in-out infinite;
  }
  @keyframes dots {
    0%, 100% { opacity: 0.35; transform: translateY(0); }
    50% { opacity: 0.9; transform: translateY(-1px); }
  }

  .tool-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: calc(100% - 34px);
    margin-left: 32px;
    animation: msg-enter 0.18s ease-out;
  }
  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    max-width: 100%;
    min-height: 23px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    line-height: 1.2;
    color: var(--text-2);
    background: color-mix(in srgb, var(--accent) 8%, var(--surface-soft));
    border: 0.5px solid color-mix(in srgb, var(--accent) 23%, var(--border));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28);
  }
  .tool-chip.ok {
    color: var(--green);
    border-color: color-mix(in srgb, var(--green) 38%, var(--border));
    background: color-mix(in srgb, var(--green) 9%, var(--surface-soft));
  }
  .tool-chip.err {
    color: var(--red);
    border-color: color-mix(in srgb, var(--red) 40%, var(--border));
    background: color-mix(in srgb, var(--red) 8%, var(--surface-soft));
  }
  .tool-icon {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.72;
    flex: 0 0 auto;
  }
  .tool-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .composer-wrap {
    flex: 0 0 auto;
    padding: 10px 10px 12px;
    background: linear-gradient(180deg, transparent, rgba(245,245,247,0.82) 24%, rgba(245,245,247,0.96));
  }
  .send-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .composer-island {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: 18px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    transition: box-shadow .2s, border-color .2s;
  }
  .composer-island:focus-within {
    border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .composer-form,
  .composer-row {
    width: 100%;
    min-width: 0;
    display: flex;
  }
  textarea {
    flex: 1;
    min-width: 0;
    min-height: 24px;
    max-height: 136px;
    resize: none;
    border: none;
    padding: 5px 4px;
    background: transparent;
    color: inherit;
    font-size: 15px;
    line-height: 1.52;
    outline: none;
    overflow-y: hidden;
  }
  textarea::placeholder { color: var(--text-3); }
  .action-slot {
    flex: 0 0 86px;
    width: 86px;
  }
  .action-capsule {
    position: relative;
    width: 100%;
    min-height: 48px;
    padding: 0 12px;
    border: none;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    background: var(--surface);
    border: 0.5px solid var(--border);
    cursor: pointer;
    box-shadow: var(--shadow);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    overflow: hidden;
    white-space: nowrap;
    transition: opacity .15s, transform .12s, background .2s, color .2s, border-color .2s;
  }
  .action-capsule:hover {
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    transform: translateY(-1px);
  }
  .action-capsule.stop {
    color: var(--red);
  }
  .action-capsule.stop:hover {
    background: color-mix(in srgb, var(--red) 10%, var(--surface));
  }
  .action-capsule.mic.recording {
    color: #fff;
    background: linear-gradient(180deg, color-mix(in srgb, var(--red) 92%, #fff 8%), color-mix(in srgb, var(--red) 84%, #111 16%));
    border-color: color-mix(in srgb, var(--red) 55%, var(--border));
    box-shadow: 0 10px 28px rgba(255, 59, 48, 0.22), inset 0 1px 0 rgba(255,255,255,0.15);
    animation: voiceCapsulePulse 2.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  .action-capsule:disabled {
    opacity: .38;
    cursor: default;
  }
  .action-capsule:not(:disabled):active { transform: scale(.97); }
  .action-capsule-stack {
    position: relative;
    display: block;
    width: 100%;
    min-height: 22px;
  }
  .action-face {
    position: absolute;
    inset: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    opacity: 0;
    filter: blur(5px);
    transform: scale(.94);
    pointer-events: none;
    transition: opacity .18s, transform .24s, filter .2s;
  }
  .action-face.visible {
    opacity: 1;
    filter: blur(0);
    transform: scale(1);
  }
  .action-face svg {
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
  }
  .action-face span {
    font-size: 13px;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @keyframes voiceCapsulePulse {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-1px) scale(1.012); }
  }
  .composer-hint {
    margin: 7px 8px 0;
    color: var(--text-3);
    font-size: 10.5px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 340px) {
    .action-slot {
      flex-basis: 58px;
      width: 58px;
    }
    .action-capsule { padding: 0 10px; }
    .action-face span { display: none; }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent: #fbbf24;
      --accent-2: #ffd86a;
      --bg: #1c1c1e;
      --surface: rgba(44, 44, 46, 0.72);
      --surface-strong: rgba(34, 34, 36, 0.92);
      --surface-soft: rgba(44, 44, 46, 0.52);
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f5f5f7;
      --text-2: #c7c7cc;
      --text-3: #98989d;
      --shadow: 0 10px 34px rgba(0, 0, 0, 0.36);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.26);
    }
    html, body {
      background:
        linear-gradient(180deg, rgba(36,36,38,0.78), rgba(28,28,30,0.96)),
        var(--bg);
    }
    .panel { background: rgba(28, 28, 30, 0.82); }
    .topbar {
      background: linear-gradient(180deg, rgba(34,34,36,0.94), rgba(28,28,30,0.68));
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }
    .kind-tag { background: rgba(255,255,255,0.07); }
    .row.user .bubble { color: #1d1d1f; }
    .composer-wrap {
      background: linear-gradient(180deg, transparent, rgba(28,28,30,0.82) 24%, rgba(28,28,30,0.97));
    }
    .bubble.error {
      color: #ffb4ab;
      border-color: rgba(255, 180, 171, 0.2);
      background: rgba(90, 30, 26, 0.68);
    }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); }
  }
  html[data-theme="dark"],
  body[data-theme="dark"] {
    --accent: #fbbf24;
    --accent-2: #ffd86a;
    --bg: #1c1c1e;
    --surface: rgba(44, 44, 46, 0.72);
    --surface-strong: rgba(34, 34, 36, 0.92);
    --surface-soft: rgba(44, 44, 46, 0.52);
    --border: rgba(255, 255, 255, 0.11);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #f5f5f7;
    --text-2: #c7c7cc;
    --text-3: #98989d;
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.36);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.26);
  }
  html[data-theme="dark"],
  html[data-theme="dark"] body,
  body[data-theme="dark"] {
    background:
      linear-gradient(180deg, rgba(36,36,38,0.78), rgba(28,28,30,0.96)),
      var(--bg);
  }
  html[data-theme="dark"] .panel,
  body[data-theme="dark"] .panel { background: rgba(28, 28, 30, 0.82); }
  html[data-theme="dark"] .topbar,
  body[data-theme="dark"] .topbar {
    background: linear-gradient(180deg, rgba(34,34,36,0.94), rgba(28,28,30,0.68));
  }
  html[data-theme="dark"] .icon-btn:hover,
  body[data-theme="dark"] .icon-btn:hover { background: rgba(255,255,255,0.08); }
  html[data-theme="dark"] .kind-tag,
  body[data-theme="dark"] .kind-tag { background: rgba(255,255,255,0.07); }
  html[data-theme="dark"] body.page-kind-reader .kind-tag,
  body[data-theme="dark"].page-kind-reader .kind-tag {
    background: color-mix(in srgb, var(--accent) 14%, rgba(44,44,46,0.7));
    border-color: color-mix(in srgb, var(--accent) 32%, var(--border));
  }
  html[data-theme="dark"] .row.user .bubble,
  body[data-theme="dark"] .row.user .bubble { color: #1d1d1f; }
  html[data-theme="dark"] .composer-wrap,
  body[data-theme="dark"] .composer-wrap {
    background: linear-gradient(180deg, transparent, rgba(28,28,30,0.82) 24%, rgba(28,28,30,0.97));
  }
  html[data-theme="dark"] .bubble.error,
  body[data-theme="dark"] .bubble.error {
    color: #ffb4ab;
    border-color: rgba(255, 180, 171, 0.2);
    background: rgba(90, 30, 26, 0.68);
  }
  html[data-theme="dark"] .messages::-webkit-scrollbar-thumb,
  body[data-theme="dark"] .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>
  <section class="panel">
    <header class="topbar">
      <img class="brand" src="logo.png" alt="" aria-hidden="true">
      <div class="head-text">
        <div class="title-row">
          <div class="title" id="title">エージェント</div>
          <div class="live-pill" id="livePill"><span class="live-dot"></span><span id="liveText">操作中</span></div>
        </div>
        <div class="meta-row">
          <span class="kind-tag" id="kindTag">エージェント</span>
        </div>
      </div>
      <button class="icon-btn close" id="close" type="button" title="閉じる" aria-label="閉じる">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <main class="messages" id="messages">
      <div class="empty" id="empty">
        <img class="empty-mark" src="logo.png" alt="Selah">
        <p class="empty-title">ページを見ながら頼めます</p>
        <p class="empty-body">開いているブラウザや詳細ページの内容を読んで、クリックや要約までこの場で続けます。</p>
      </div>
    </main>

    <div class="composer-wrap">
      <div class="send-row">
        <div class="composer-island">
          <form class="composer-form" id="form">
            <div class="composer-row">
              <textarea id="input" rows="1" placeholder="このページについて聞く"></textarea>
            </div>
          </form>
        </div>
        <div class="action-slot">
          <button class="action-capsule" id="action" type="button" title="送信" disabled>
            <span class="action-capsule-stack" aria-hidden="true">
              <span class="action-face action-send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                <span>送る</span>
              </span>
              <span class="action-face action-mic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3z"/>
                  <path d="M19 11a7 7 0 0 1-14 0"/>
                  <path d="M12 18v3"/>
                  <path d="M8 21h8"/>
                </svg>
                <span id="micLabel">音声</span>
              </span>
              <span class="action-face action-stop">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                <span>停止</span>
              </span>
            </span>
          </button>
        </div>
      </div>
      <div class="composer-hint" id="hint">Enter で送信、Shift+Enter で改行</div>
    </div>
  </section>

<script>
(async () => {
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const params = new URLSearchParams(window.location.search);
  const embedded = params.get('embedded') === '1';
  const ownerLabel = params.get('owner') || '';
  const pageTarget = params.get('target') || '';
  const pageTitle = params.get('title') || '';
  const pageKind = params.get('kind') || '';

  function applyTheme(theme) {
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
      document.body.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.body.removeAttribute('data-theme');
    }
  }

  try {
    applyTheme(await invoke('get_app_theme'));
  } catch (_) {}
  try {
    await listen('theme-changed', (event) => applyTheme(event.payload));
    await listen('app-theme-changed', async () => {
      try { applyTheme(await invoke('get_app_theme')); } catch (_) {}
    });
  } catch (_) {}

  document.body.classList.toggle('embedded', embedded);
  if (pageKind) {
    document.body.classList.add('page-kind-' + pageKind.toLowerCase().replace(/[^a-z0-9_-]+/g, '-'));
  }

  const CONV_KEY = pageTarget
    ? 'selah-agent-popup-conv-id:' + pageTarget
    : 'selah-agent-popup-conv-id';
  const convStorage = pageTarget ? sessionStorage : localStorage;
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty');
  const livePill = document.getElementById('livePill');
  const liveText = document.getElementById('liveText');
  const titleEl = document.getElementById('title');
  const kindTagEl = document.getElementById('kindTag');
  const formEl = document.getElementById('form');
  const inputEl = document.getElementById('input');
  const actionBtn = document.getElementById('action');
  const micLabel = document.getElementById('micLabel');
  const closeBtn = document.getElementById('close');

  let convId = convStorage.getItem(CONV_KEY) || '';
  let sending = false;
  let unlisten = null;
  let streamNode = null;
  let toolStack = null;
  let composing = false;
  let suppressEnterUntil = 0;
  let actionMode = 'mic';
  let sttListening = false;
  let sttBaseText = '';
  let sttCommittedText = '';
  let sttPartialText = '';
  let sttStopRequested = false;
  let preemptedCaller = null;
  let unlistenSttPartial = null;
  let unlistenSttFinal = null;
  let unlistenSttState = null;
  let unlistenSttError = null;

  function pageLabel() {
    if (pageTarget) return pageTarget.replace(/-ct$/, '').replace(/-/g, ' ');
    if (ownerLabel) return ownerLabel.replace(/-/g, ' ');
    return 'エージェント';
  }

  function cleanTitle(value) {
    return String(value || '')
      .replace(/\s+/g, ' ')
      .replace(/\s+[-|–—]\s+Selah$/i, '')
      .trim();
  }

  function displayTitle() {
    const explicit = cleanTitle(pageTitle);
    if (explicit) return explicit;
    const doc = cleanTitle(document.title);
    if (doc && doc !== 'Agent' && doc !== 'エージェント') return doc;
    return pageTarget || ownerLabel ? pageLabel() : 'エージェント';
  }

  function displayKind() {
    const kind = cleanTitle(pageKind).toLowerCase();
    if (kind === 'browser') return 'ブラウザ';
    if (kind === 'detail') return '詳細';
    if (kind === 'reader') return 'リーダー';
    if (kind === 'agent') return 'エージェント';
    if (kind) return kind;
    if (/detail|university|luna|kwic|syllabus/i.test(pageTarget || ownerLabel)) return '詳細';
    if (pageTarget || ownerLabel) return 'ブラウザ';
    return 'エージェント';
  }

  function setStatus(text, visible) {
    livePill.classList.toggle('active', !!visible);
    if (visible) liveText.textContent = text || '操作中';
  }

  function scrollBottom() {
    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
  }

  function clearEmpty() {
    if (emptyEl && emptyEl.isConnected) emptyEl.remove();
  }

  function addMessage(role, content, streaming, error) {
    clearEmpty();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    if (role === 'assistant') {
      const avatar = document.createElement('img');
      avatar.className = 'avatar' + (streaming ? ' pulse' : '');
      avatar.src = 'logo.png';
      avatar.alt = '';
      row.appendChild(avatar);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (error ? ' error' : '');
    bubble.textContent = content || '';
    if (streaming) bubble.dataset.streaming = '1';
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return bubble;
  }

  function ensureToolStack() {
    clearEmpty();
    if (toolStack && toolStack.isConnected) return toolStack;
    toolStack = document.createElement('div');
    toolStack.className = 'tool-stack';
    messagesEl.appendChild(toolStack);
    return toolStack;
  }

  function addTool(name, state) {
    const stack = ensureToolStack();
    const chip = document.createElement('div');
    chip.className = 'tool-chip ' + (state || 'running');
    const dot = document.createElement('span');
    dot.className = 'tool-icon';
    const label = document.createElement('span');
    label.className = 'tool-name';
    label.textContent = name;
    chip.appendChild(dot);
    chip.appendChild(label);
    stack.appendChild(chip);
    scrollBottom();
  }

  async function ensureConversation() {
    if (convId) {
      try {
        await invoke('agent_load_messages', { convId });
        return convId;
      } catch (_) {
        convId = '';
        convStorage.removeItem(CONV_KEY);
      }
    }
    convId = await invoke('agent_create_conversation', { title: pageTarget ? 'ページエージェント' : 'ミニエージェント' });
    convStorage.setItem(CONV_KEY, convId);
    return convId;
  }

  async function renderHistory() {
    if (!convId) return;
    let rows = [];
    try {
      rows = await invoke('agent_load_messages', { convId });
    } catch (_) {
      return;
    }
    messagesEl.querySelectorAll('.row,.tool-stack').forEach((n) => n.remove());
    toolStack = null;
    for (const row of rows) {
      if (row.role === 'user' || row.role === 'assistant') {
        addMessage(row.role, row.content || '', false, false);
      }
    }
    if (!rows.some((r) => r.role === 'user' || r.role === 'assistant')) {
      if (emptyEl && !emptyEl.isConnected) messagesEl.appendChild(emptyEl);
    }
    scrollBottom();
  }

  async function bindStream(id) {
    if (unlisten) {
      unlisten();
      unlisten = null;
    }
    unlisten = await listen(`agent_stream:${id}`, (event) => {
      handleStream(event.payload || {});
    });
  }

  async function finishTurn(refresh) {
    sending = false;
    if (streamNode) {
      const avatar = streamNode.parentElement?.querySelector('.avatar');
      avatar?.classList.remove('pulse');
    }
    streamNode = null;
    toolStack = null;
    setStatus('準備完了', false);
    setSendState();
    if (refresh && convId) await renderHistory();
  }

  function handleStream(ev) {
    if (!sending) return;
    if (ev.type === 'phase') {
      const text = ev.stage === 'planning' ? '考え中…' : ev.stage === 'answering' ? '返答中…' : ev.stage;
      setStatus(text, true);
      return;
    }
    if (ev.type === 'tool_call') {
      addTool(ev.name || 'tool', 'running');
      setStatus('操作中…', true);
      return;
    }
    if (ev.type === 'tool_result') {
      addTool(ev.name || 'tool', ev.ok ? 'ok' : 'err');
      return;
    }
    if (ev.type === 'token') {
      if (!streamNode) streamNode = addMessage('assistant', '', true, false);
      streamNode.textContent += ev.text || '';
      scrollBottom();
      return;
    }
    if (ev.type === 'error') {
      addMessage('assistant', '……エラーが出たみたい。\n\n' + (ev.message || ''), false, true);
      finishTurn(false);
      return;
    }
    if (ev.type === 'done') {
      finishTurn(true);
    }
  }

  function setSendState() {
    const hasText = inputEl.value.trim().length > 0;
    actionMode = sending ? 'stop' : (sttListening || sttPartialText.trim() || !hasText ? 'mic' : 'send');
    actionBtn.classList.toggle('stop', actionMode === 'stop');
    actionBtn.classList.toggle('mic', actionMode === 'mic');
    actionBtn.classList.toggle('recording', actionMode === 'mic' && sttListening);
    actionBtn.disabled = actionMode === 'send' && !hasText;
    actionBtn.title = actionMode === 'stop' ? '停止' : actionMode === 'mic' ? (sttListening ? '音声入力を停止' : '音声入力') : '送信';
    micLabel.textContent = sttListening ? '停止' : '音声';
    document.querySelectorAll('.action-face').forEach((el) => el.classList.remove('visible'));
    document.querySelector('.action-' + actionMode)?.classList.add('visible');
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 136) + 'px';
  }

  function mergeSttText(base, committed, partial) {
    const spoken = [committed.trim(), partial.trim()].filter(Boolean).join(' ').trim();
    if (!spoken) return base;
    if (!base) return spoken;
    if (/\s$/.test(base)) return base + spoken;
    return base + '\n' + spoken;
  }

  function applySttText() {
    inputEl.value = mergeSttText(sttBaseText, sttCommittedText, sttPartialText);
    autoGrow();
    setSendState();
  }

  async function refreshAgentSttState() {
    try {
      const [running, caller] = await Promise.all([
        invoke('stt_is_running'),
        invoke('stt_get_active_caller'),
      ]);
      sttListening = !!running && caller === 'agent';
    } catch (_) {
      sttListening = false;
    }
    setSendState();
  }

  async function toggleStt() {
    if (sttListening) {
      await stopStt();
      return;
    }
    try {
      sttBaseText = inputEl.value;
      sttCommittedText = '';
      sttPartialText = '';
      sttStopRequested = false;
      preemptedCaller = await invoke('stt_start_stream', { caller: 'agent', preempt: true });
      await refreshAgentSttState();
    } catch (e) {
      addMessage('assistant', '音声入力を開始できませんでした。\n\n' + String(e), false, true);
    }
  }

  async function stopStt(autoSend = true) {
    try {
      sttStopRequested = autoSend;
      await invoke('stt_stop_stream');
    } catch (e) {
      sttStopRequested = false;
      addMessage('assistant', '音声入力を停止できませんでした。\n\n' + String(e), false, true);
    }
  }

  async function resumePreempted() {
    if (!preemptedCaller) return;
    const caller = preemptedCaller;
    preemptedCaller = null;
    try {
      await invoke('stt_start_stream', { caller });
    } catch (_) {}
  }

  async function handleActionClick() {
    if (actionMode === 'stop') {
      await stop();
    } else if (actionMode === 'mic') {
      await toggleStt();
    } else {
      await send();
    }
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sending) return;
    if (sttListening) await stopStt(false);
    const id = await ensureConversation();
    await bindStream(id);
    inputEl.value = '';
    autoGrow();
    addMessage('user', text, false, false);
    sending = true;
    streamNode = addMessage('assistant', '', true, false);
    toolStack = null;
    setStatus('考え中…', true);
    setSendState();
    try {
      if (pageTarget) {
        await invoke('agent_send_with_context', {
          convId: id,
          content: text,
          images: [],
          browserTarget: pageTarget,
          pageTitle: titleEl.textContent || displayTitle(),
          pageKind: displayKind(),
        });
      } else {
        await invoke('agent_send', { convId: id, content: text, images: [] });
      }
      setTimeout(() => {
        if (sending) finishTurn(true);
      }, 500);
    } catch (e) {
      if (!sending) return;
      addMessage('assistant', '……送信に失敗したみたい。\n\n' + String(e), false, true);
      finishTurn(false);
    }
  }

  async function stop() {
    if (!sending || !convId) return;
    sending = false;
    setStatus('停止しました', false);
    setSendState();
    await invoke('agent_cancel', { convId }).catch(() => {});
  }

  closeBtn.addEventListener('click', () => {
    if (embedded && ownerLabel) {
      invoke('close_agent_popup', { ownerLabel }).catch(() => {});
    } else {
      window.__TAURI__?.window?.getCurrentWindow?.().close().catch(() => {});
    }
  });

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!sending) send();
  });
  actionBtn.addEventListener('click', handleActionClick);
  inputEl.addEventListener('input', () => {
    if (!sttListening) {
      sttBaseText = inputEl.value;
      sttCommittedText = '';
      sttPartialText = '';
    }
    autoGrow();
    setSendState();
  });
  inputEl.addEventListener('compositionstart', () => { composing = true; });
  inputEl.addEventListener('compositionend', () => {
    composing = false;
    suppressEnterUntil = performance.now() + 160;
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    if (composing || e.isComposing || performance.now() < suppressEnterUntil) return;
    e.preventDefault();
    if (!sending) send();
  });

  async function bindStt() {
    await refreshAgentSttState();
    unlistenSttPartial = await listen('stt-partial', (ev) => {
      if (ev.payload?.caller !== 'agent') return;
      sttPartialText = ev.payload.text || '';
      applySttText();
    });
    unlistenSttFinal = await listen('stt-final', (ev) => {
      if (ev.payload?.caller !== 'agent') return;
      sttCommittedText = ev.payload.text || sttCommittedText;
      sttPartialText = '';
      applySttText();
    });
    unlistenSttState = await listen('stt-state', (ev) => {
      if (ev.payload?.caller !== 'agent') return;
      const wasListening = sttListening;
      sttListening = ev.payload.state === 'initializing' || ev.payload.state === 'listening';
      if (!sttListening) {
        sttPartialText = '';
        applySttText();
        const shouldAutoSend = wasListening && sttStopRequested && !!sttCommittedText.trim();
        sttStopRequested = false;
        if (shouldAutoSend) setTimeout(() => send(), 0);
        resumePreempted();
      } else {
        setSendState();
      }
    });
    unlistenSttError = await listen('stt-error', (ev) => {
      if (ev.payload?.caller !== 'agent') return;
      sttListening = false;
      sttStopRequested = false;
      setSendState();
      addMessage('assistant', '音声入力エラー\n\n' + (ev.payload.message || ''), false, true);
    });
  }

  function cleanup() {
    if (unlisten) unlisten();
    unlistenSttPartial?.();
    unlistenSttFinal?.();
    unlistenSttState?.();
    unlistenSttError?.();
    if (sttListening) invoke('stt_stop_stream').catch(() => {});
    if (convId && sending) invoke('agent_cancel', { convId }).catch(() => {});
  }
  window.addEventListener('beforeunload', cleanup);

  try {
    titleEl.textContent = displayTitle();
    document.title = titleEl.textContent;
    kindTagEl.textContent = displayKind();
    await ensureConversation();
    await bindStream(convId);
    await bindStt();
    await renderHistory();
    setStatus('準備完了', false);
  } catch (e) {
    setStatus('初期化失敗', true);
    addMessage('assistant', 'エージェントを起動できませんでした。\n\n' + String(e), false, true);
  }
  setSendState();
  setTimeout(() => inputEl.focus(), 80);
})();
</script>
</body>
</html>
